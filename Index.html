<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ประวัติงานผู้รับเหมา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --panel2:#f8fafc; --line:#e2e8f0; --text:#0f172a; --muted:#64748b;
  --brand:#1d4ed8; --brand-soft:#dbeafe; --nav:#0f172a; --nav-text:#cbd5e1; --nav-active:#1e293b;
  --pm:#2563eb; --pm-soft:#dbeafe; --cm:#dc2626; --cm-soft:#fee2e2; --rp:#d97706; --rp-soft:#fef3c7;
  --ok:#16a34a; --ok-soft:#dcfce7; --warn:#d97706; --warn-soft:#fef3c7; --bad:#dc2626; --bad-soft:#fee2e2;
  --gray-soft:#f1f5f9; --shadow:0 1px 2px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.08);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1120; --panel:#111827; --panel2:#0f172a; --line:#1f2937; --text:#e5e7eb; --muted:#94a3b8;
  --brand:#60a5fa; --brand-soft:#1e3a8a; --nav:#020617; --nav-text:#94a3b8; --nav-active:#1e293b;
  --pm:#60a5fa; --pm-soft:#1e3a8a; --cm:#f87171; --cm-soft:#7f1d1d; --rp:#fbbf24; --rp-soft:#78350f;
  --ok:#4ade80; --ok-soft:#14532d; --warn:#fbbf24; --warn-soft:#78350f; --bad:#f87171; --bad-soft:#7f1d1d; --gray-soft:#1f2937;
}}
:root[data-theme="dark"]{
  --bg:#0b1120; --panel:#111827; --panel2:#0f172a; --line:#1f2937; --text:#e5e7eb; --muted:#94a3b8;
  --brand:#60a5fa; --brand-soft:#1e3a8a; --nav:#020617; --nav-text:#94a3b8; --nav-active:#1e293b;
  --pm:#60a5fa; --pm-soft:#1e3a8a; --cm:#f87171; --cm-soft:#7f1d1d; --rp:#fbbf24; --rp-soft:#78350f;
  --ok:#4ade80; --ok-soft:#14532d; --warn:#fbbf24; --warn-soft:#78350f; --bad:#f87171; --bad-soft:#7f1d1d; --gray-soft:#1f2937;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Sarabun,system-ui,sans-serif;font-size:15px}
a{color:var(--brand)}
.app{display:flex;min-height:100vh}
aside{width:236px;background:var(--nav);color:var(--nav-text);flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
aside .logo{padding:18px 18px 14px;color:#fff;font-weight:700;font-size:17px;line-height:1.3;border-bottom:1px solid #1e293b}
aside .logo small{display:block;font-weight:400;color:var(--nav-text);font-size:12px;margin-top:2px}
aside nav a{display:flex;align-items:center;gap:10px;padding:10px 18px;color:var(--nav-text);text-decoration:none;font-size:14.5px;border-left:3px solid transparent}
aside nav a:hover{background:var(--nav-active);color:#fff}
aside nav a.on{background:var(--nav-active);color:#fff;border-left-color:#60a5fa}
aside nav .sec{padding:14px 18px 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#64748b}
aside .cnt{margin-left:auto;background:#dc2626;color:#fff;border-radius:10px;font-size:11px;padding:0 7px;min-width:20px;text-align:center}
main{flex:1;min-width:0;padding:22px 26px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;margin:0;font-weight:700}
.top .sub{color:var(--muted);font-size:13.5px}
.top .sp{flex:1}
.menu-btn{display:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:16px}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.c2{grid-template-columns:1fr 1fr}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:28px;font-weight:700;margin-top:2px}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 13px;border-radius:7px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent}
input,select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label.f>span{display:block;margin-bottom:4px}
.req{color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;min-width:150px}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--panel2);font-weight:600;color:var(--muted);font-size:13px;position:sticky;top:0;z-index:1;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.b-pm{background:var(--pm-soft);color:var(--pm)} .b-cm{background:var(--cm-soft);color:var(--cm)} .b-rp{background:var(--rp-soft);color:var(--rp)}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)}
.b-gray{background:var(--gray-soft);color:var(--muted)} .b-brand{background:var(--brand-soft);color:var(--brand)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:none;font:inherit;padding:8px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:6px;height:180px;padding:8px 0 0}
.bars .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bars .st{display:flex;align-items:flex-end;gap:2px;height:150px;width:100%;justify-content:center}
.bars .b{width:42%;border-radius:3px 3px 0 0;min-height:1px}
.bars .lb{font-size:11.5px;color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.timeline{position:relative;padding-left:18px}
.timeline:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ti{position:relative;margin-bottom:12px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.ti:before{content:"";position:absolute;left:-18px;top:13px;width:12px;height:12px;border-radius:50%;background:var(--pm);border:2px solid var(--panel)}
.ti.CM:before{background:var(--cm)} .ti.REPLACE:before{background:var(--rp)}
.ti .hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px}
.ti .bd{font-size:14px;margin-top:4px;white-space:pre-wrap}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 18px;font-size:14px}
.dl div{display:flex;gap:6px;border-bottom:1px dashed var(--line);padding:4px 0}
.dl b{color:var(--muted);font-weight:500;min-width:110px}
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;z-index:50;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border-radius:12px;width:min(980px,100%);box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal .mh h2{margin:0;font-size:18px;flex:1}
.modal .mb{padding:16px 18px;max-height:calc(100vh - 190px);overflow:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel);font:inherit;font-size:14px;padding:7px 14px;cursor:pointer;color:var(--text);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--brand);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--brand-soft);color:var(--brand);padding:2px 8px;border-radius:12px;font-size:13px}
.chip button{border:0;background:none;color:inherit;cursor:pointer;font-size:14px;padding:0 2px}
.picker{position:relative}
.picker .dd{position:absolute;z-index:5;left:0;right:0;top:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:240px;overflow:auto;box-shadow:var(--shadow);display:none}
.picker .dd.on{display:block}
.picker .dd div{padding:6px 10px;cursor:pointer;font-size:14px}
.picker .dd div:hover{background:var(--panel2)}
.section-t{font-weight:600;font-size:14.5px;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.matrix td,.matrix th{padding:5px 6px;text-align:center;font-size:12.5px}
.matrix td:first-child,.matrix th:first-child{text-align:left;white-space:nowrap}
.cell{display:inline-block;min-width:30px;padding:2px 4px;border-radius:5px;font-weight:600}
.c-done{background:var(--ok-soft);color:var(--ok)} .c-miss{background:var(--bad-soft);color:var(--bad)} .c-cm{background:var(--cm-soft);color:var(--cm)} .c-na{color:var(--line)}
.toast{position:fixed;right:18px;bottom:18px;background:#0f172a;color:#fff;padding:10px 16px;border-radius:8px;z-index:99;display:none;max-width:360px}
.toast.on{display:block}
.empty{padding:28px;text-align:center;color:var(--muted)}
.wf{display:flex;gap:0;align-items:center;flex-wrap:wrap;font-size:13px}
.wf span{padding:4px 10px;border:1px solid var(--line);background:var(--panel2)}
.wf span.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.wf i{color:var(--muted);padding:0 4px;font-style:normal}
.prog{height:8px;background:var(--gray-soft);border-radius:4px;overflow:hidden;min-width:80px}
.prog i{display:block;height:100%;background:var(--ok)}
@media (max-width:860px){
  aside{position:fixed;left:-250px;z-index:60;transition:left .2s}
  aside.on{left:0}
  .menu-btn{display:inline-flex}
  main{padding:14px 16px 60px}
  .c2{grid-template-columns:1fr}
  .toolbar input,.toolbar select{min-width:0;flex:1 1 140px}
}
@media print{aside,.top .btn,.toolbar,.no-print{display:none!important} main{padding:0} .card{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="logo">ระบบประวัติงานผู้รับเหมา<small>Contractor Maintenance History · อาคารภูมิสิริมังคลานุสรณ์</small></div>
  <nav id="nav"></nav>
  <div id="sync" class="small" style="padding:14px 18px;color:#64748b;border-top:1px solid #1e293b;margin-top:10px"></div>
</aside>
<main id="main"></main>
</div>
<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ====================== CONFIG ====================== */
const TASKS = {'1M':{m:1,t:'รายเดือน'},'2M':{m:2,t:'2 เดือน'},'3M':{m:3,t:'3 เดือน'},'6M':{m:6,t:'6 เดือน'},'H':{m:6,t:'ครึ่งปี (H)'},'Y':{m:12,t:'รายปี'}};
const TYPE = {PM:{t:'บำรุงรักษา (PM)',c:'b-pm'},CM:{t:'ซ่อม (CM)',c:'b-cm'},REPLACE:{t:'เปลี่ยนอุปกรณ์',c:'b-rp'}};
const RESULT = {normal:{t:'ปกติ',c:'b-ok'},needParts:{t:'ควรเปลี่ยนอะไหล่',c:'b-warn'},broken:{t:'ชำรุด/รอซ่อม',c:'b-bad'}};
const STATUS = {draft:{t:'ร่าง',c:'b-gray'},submitted:{t:'รอตรวจรับ',c:'b-warn'},approved:{t:'ตรวจรับแล้ว',c:'b-ok'},rejected:{t:'ตีกลับแก้ไข',c:'b-bad'}};
const CTYPE = {regular:{t:'ประจำ (สัญญา MA)',c:'b-brand'},adhoc:{t:'เฉพาะกิจ',c:'b-rp'}};
const SYS_TH = {'Electrical System':'ระบบไฟฟ้า','Airconditioning System':'ระบบปรับอากาศ','Sanitary System':'ระบบสุขาภิบาล','Fire Protection System':'ระบบป้องกันอัคคีภัย','Medical Gas System':'ระบบแก๊สทางการแพทย์'};
const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const LS_KEY = 'contractorHistory.v1';
/* Regular contractors seen in the Sep 2569 monthly service reports (file 2) + history (file 1).
   Contract dates / totals are left blank on purpose: fill them in on the ผู้รับเหมา page. */
const SEED_CONTRACTORS = [
  {id:'c-iyara',name:'บจก. ไอยรา อินเตอร์เทรด',short:'ไอยรา',type:'regular',scope:'บำรุงรักษาเครื่องกำเนิดไฟฟ้าสำรอง (Generator)',cats:['Generator'],freq:'ทุก 3 เดือน (ตามรายงาน)',lastRound:12},
  {id:'c-sahapee',name:'สหพีร์',short:'สหพีร์',type:'regular',scope:'Cooling Tower, เครื่องสูบน้ำปรับอากาศ, เครื่องสูบน้ำประปา',cats:['Cooling Tower','Primary Chiller Pump','Secondary Chiller Pump','Condenser pump','Cold Water Transfer Pump'],freq:'รายเดือน',lastRound:12},
  {id:'c-jep',name:'JEP',short:'JEP',type:'regular',scope:'ระบบแก๊สทางการแพทย์',cats:['Medical Air','Instrument Air','Vacuum','Oxygen Manifold','Nitrous Oxide Manifold','Carbon dioxide Manifold'],freq:'รายเดือน',lastRound:12},
  {id:'c-knc',name:'KNC',short:'KNC',type:'regular',scope:'ระบบปั๊มสูบน้ำเสีย / ดูดตะกอนบ่อเกรอะและบ่อน้ำเสีย',cats:['Submersible Drainage Pump','Submersible Sewage Pump','Waste Water Pump','Neutralization Pump'],freq:'รายเดือน',lastRound:12},
  {id:'c-forbes',name:'ฟอร์เบส',short:'ฟอร์เบส',type:'regular',scope:'ระบบน้ำร้อน (Heat Pump)',cats:['Heat Pump'],freq:'รายเดือน',lastRound:36},
  {id:'c-hitachi',name:'ฮิตาชิ',short:'ฮิตาชิ',type:'regular',scope:'ลิฟต์และบันไดเลื่อน',cats:[],freq:'รายเดือน',lastRound:36},
  {id:'c-penelles',name:'เพเนเล่ส์',short:'เพเนเล่ส์',type:'regular',scope:'ประตูอัตโนมัติ Hermetic Door',cats:[],freq:'',lastRound:6},
  {id:'c-leader',name:'ลีดเดอร์โปรดักส์',short:'ลีดเดอร์ฯ',type:'regular',scope:'สระธาราบำบัด ชั้น 14',cats:[],freq:'รายเดือน',lastRound:36},
  {id:'c-jci',name:'Johnson Controls',short:'JCI',type:'regular',scope:'เครื่องทำน้ำเย็น (Chiller)',cats:['Chiller'],freq:'2 เดือน / 6 เดือน / รายปี',lastRound:null},
  {id:'c-firetrade',name:'บ. ไฟร์เทรด',short:'ไฟร์เทรด',type:'regular',scope:'FM-200 / Pre Action',cats:['FM-200','Pre Action'],freq:'',lastRound:null}
];
const SEED_REPORTS = [
  ['c-forbes','รายงานการบำรุงรักษาระบบน้ำร้อน',36],['c-sahapee','รายงานการบำรุงรักษาเครื่องสูบน้ำปรับอากาศ (Air Condition Water Pump)',12],
  ['c-hitachi','รายงานการบำรุงรักษาลิฟต์และบันไดเลื่อน',36],['c-jep','รายงานการบำรุงรักษาระบบแก๊สทางการแพทย์',12],
  ['c-penelles','รายงานการบำรุงรักษาประตูอัตโนมัติ Hermetic Door',6],['c-leader','รายงานการบำรุงรักษาสระธาราบำบัด ชั้น 14',36],
  ['c-knc','รายงานระบบปั๊มสูบน้ำเสีย',12],['c-sahapee','รายงานการบำรุงรักษาเครื่องสูบน้ำประปา (Cold Water Pump)',12],
  ['c-knc','รายงานการดูดตะกอนบ่อเกรอะและบ่อน้ำเสีย',null],['c-iyara','รายงานการบำรุงรักษาเครื่องกำเนิดไฟฟ้าสำรอง (Generator)',12],
  ['c-sahapee','รายงานการบำรุงรักษาหอระบายความร้อน (Cooling Tower)',12]
].map((r,i)=>({id:'rp-seed-'+(i+1),contractorId:r[0],title:r[1],round:r[2],month:'2026-09',receivedDate:'',link:'',equipIds:[],summary:'',issues:'',seed:true}));
SEED_REPORTS[9].serviceDate='2026-09-25';
SEED_REPORTS[9].summary='เปลี่ยนไส้กรองทั้งหมด + น้ำมันเครื่อง + น้ำยาหล่อเย็น + แบตเตอรี่ (GS N200) ทุกเครื่อง';
SEED_REPORTS[9].issues='Gen No.1 ขั้วแบตเตอรี่ ขั้ว- ลูกที่ 4 หัก / Gen No.3 ขั้ว +/- ลูกที่ 2 หัก → เปลี่ยนขั้วใหม่ 3 ขั้ว แก้ไขเรียบร้อย ทดสอบเครื่องทำงานปกติ';
SEED_REPORTS[9].equipIds=['Gen-01','Gen-02','Gen-03'];

/* ====================== UTIL ====================== */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad = n=>String(n).padStart(2,'0');
const todayISO = ()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
function parseDate(s){
  s=String(s||'').trim(); if(!s||s==='-') return '';
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(m){const y=+m[1]; return (y>=2015&&y<=2035)?s:'';}
  m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})$/);
  if(m){let d=+m[1],mo=+m[2],y=+m[3]; if(y<100) y = y>=50 ? 2500+y-543 : 2000+y; else if(y>2400) y-=543;
    if(mo<1||mo>12||d<1||d>31||y<2015||y>2035) return ''; return y+'-'+pad(mo)+'-'+pad(d);}
  return '';
}
function fdate(iso){ if(!iso) return '–'; const [y,m,d]=iso.split('-'); return (+d)+' '+MONTHS[+m-1]+' '+((+y+543)%100); }

function upsertById(arr,o){ const i=arr.findIndex(x=>x.id===o.id); if(i>=0) arr[i]=o; else arr.push(o); }
function syncBadge(){ const b=$('#sync'); if(!b) return;

let DB = {equip:[],eqById:{},records:[],recById:{},contractors:[],conById:{},reports:[],issues:[]};

function fileCode(file){
  let n=file.split('/').pop().replace(/\.xlsx$/i,'').replace('ประวัติเครื่องจักร','').trim().replace(/^-\s*/,'');
  if(/^FM200/i.test(n)) return 'FM200'; if(/^Pre Action/i.test(n)) return 'PRE-ACTION';
  n=n.replace(/^Chiller/i,'CH').replace(/\s*No\.?\s*/i,'-').replace(/\s+/g,'').replace(/-+/g,'-').replace(/-$/,'');
  n=n.replace(/^([A-Za-z0-9]+?)-?(\d+)$/,(a,p,d)=>p+'-'+pad(+d));
  return n;
}
/* Local mode: seed (data.js) + overlay saved in this browser */
function rawFromLocal(){
  const equip=[], records=[], U=Store.user;
  (window.SEED_EQUIP||[]).forEach(e=>{
    const id=fileCode(e.file);
    equip.push({id,unit:(e.unit||'').replace(/\s+/g,''),file:e.file,systemGroup:e.systemGroup,category:e.category,name:(e.info&&e.info.Name)||e.category,info:e.info||{},tech:e.tech||{}});
    (e.pm||[]).forEach((p,i)=>records.push({id:`s-${id}-pm-${i}`,seed:true,type:'PM',equipId:id,date:parseDate(p.date),rawDate:p.date,task:p.task,by:p.by,parts:p.parts?[{code:p.partCode,name:p.parts,qty:''}]:[],remark:p.remark,status:'approved',contractType:'regular',contractorId:''}));
    (e.cm||[]).forEach((c,i)=>{ const hp=!!c.parts;
      records.push({id:`s-${id}-cm-${i}`,seed:true,type:hp&&/เปลี่ยน/.test(c.solution||'')?'REPLACE':'CM',equipId:id,date:parseDate(c.orderDate),rawDate:c.orderDate,finishDate:parseDate(c.finishDate),job:c.job,parts:hp?[{code:c.partCode,name:c.parts,qty:''}]:[],cause:c.cause,remark:c.solution,status:'approved',contractType:'regular',contractorId:''}); });
  });
  const recs=records.filter(r=>!U.deleted[r.id]).map(r=>U.records[r.id]?Object.assign({},r,U.records[r.id]):r);
  Object.values(U.records).forEach(r=>{ if(!r.seed&&!U.deleted[r.id]) recs.push(r); });
  const cons=SEED_CONTRACTORS.map(c=>Object.assign({},c,U.contractors[c.id]||{}));
  Object.values(U.contractors).forEach(c=>{ if(!cons.find(x=>x.id===c.id)) cons.push(c); });
  const reps=SEED_REPORTS.map(r=>Object.assign({},r,U.reports[r.id]||{})).filter(r=>!U.deleted[r.id]);
  Object.values(U.reports).forEach(r=>{ if(!r.seed&&!U.deleted[r.id]) reps.push(r); });
  return {equip,records:recs,contractors:cons,reports:reps,techMap:U.techMap,settings:U.settings};
}
/* Google Sheets mode: payload from Code.gs getAll() */
function rawFromServer(p){
  return {equip:p.equip||[],records:p.records||[],contractors:p.contractors||[],reports:p.reports||[],techMap:p.techMap||{},settings:p.settings||{}};
}
function buildDB(){
  const issues=[], techSig={};
  const pre=s=>s.replace(/[-\d]+$/,'').toUpperCase(), dig=s=>(s.match(/(\d+)\D*$/)||[])[1];
  const alias={TR:'TFMR',VP:'VA',CO:'C0'};
  const equip=RAW.equip.map(e0=>{
    const e=Object.assign({},e0), id=e.id, unit=e.unit||'';
    if(unit && (+dig(unit)!==+dig(id) || (pre(unit)!==pre(id) && alias[pre(id).replace(/\d/g,'')]!==pre(unit).replace(/\d/g,''))))
      issues.push({sev:'warn',eq:id,kind:'รหัสในชีทไม่ตรงชื่อไฟล์',detail:`ชื่อไฟล์ = ${id} แต่ในชีทเขียน ${e.info['Unit Number']||unit}`});
    if(e.tech['S/N']){ const sig=[e.tech.Brand,e.tech.Model,e.tech['S/N']].join('|'); (techSig[sig]=techSig[sig]||[]).push(e); }
    return e;
  });
  Object.values(techSig).forEach(list=>{ const cats=new Set(list.map(x=>x.category)); if(cats.size>1) list.forEach(x=>issues.push({sev:'bad',eq:x.id,kind:'S/N ซ้ำกับเครื่องต่างชนิด (ไฟล์ใดไฟล์หนึ่งคัดลอกข้อมูลเทคนิคมา)',detail:`Brand ${x.tech.Brand} / Model ${x.tech.Model} / S/N ${x.tech['S/N']} ซ้ำกับ ${list.filter(y=>y!==x).map(y=>y.id).slice(0,4).join(', ')}`})); });
  const cons=RAW.contractors.map(c=>Object.assign({},c,{cats:c.cats||[]}));
  const conById={}; cons.forEach(c=>conById[c.id]=c);
  const catCon={}; cons.filter(c=>c.type==='regular').forEach(c=>c.cats.forEach(k=>catCon[k]=catCon[k]||c.id));
  const eqById={}; equip.forEach(e=>{eqById[e.id]=e; e.contractorId=catCon[e.category]||null;});
  const tm=RAW.techMap||{};
  const all=RAW.records.map(r0=>{
    const r=Object.assign({},r0);
    if(!r.contractorId){ // derive company: explicit name in "by", else technician → contractor map
      if(/johnson/i.test(r.by||'')) r.contractorId='c-jci';
      else if(/ไฟร์เทรด/.test(r.by||'')) r.contractorId='c-firetrade';
      else if(r.by && tm[normName(r.by)]) r.contractorId=tm[normName(r.by)];
    }
    if(r.seed){
      if(!r.date) issues.push({sev:'bad',eq:r.equipId,kind:r.type==='PM'?'วันที่ PM อ่านไม่ได้/ผิดปกติ':'วันแจ้งซ่อมอ่านไม่ได้/ผิดปกติ',detail:`ค่า "${r.rawDate}"`});
      if(r.type==='PM'&&!r.task) issues.push({sev:'warn',eq:r.equipId,kind:'ไม่ระบุรอบ PM',detail:`${r.rawDate} ${r.remark||''}`.slice(0,90)});
    }
    return r;
  });
  all.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const recById={}; all.forEach(r=>recById[r.id]=r);
  const reps=RAW.reports.map(r=>Object.assign({},r,{equipIds:r.equipIds||[]}));
  DB={equip,eqById,records:all,recById,contractors:cons,conById,reports:reps,issues};
  equip.forEach(e=>{ e.recs=[]; });
  all.forEach(r=>{ const e=eqById[r.equipId]; if(e) e.recs.push(r); });
  equip.forEach(computeEqStats);
}
function computeEqStats(e){
  const pm=e.recs.filter(r=>r.type==='PM'&&r.date&&r.status!=='rejected');
  const freqs=pm.map(r=>(TASKS[r.task]||{}).m).filter(Boolean);
  const cnt={}; freqs.forEach(f=>cnt[f]=(cnt[f]||0)+1);
  // base frequency = smallest interval that appears at least twice (else smallest seen)
  const keys=Object.keys(cnt).map(Number).sort((a,b)=>a-b);
  e.baseFreq = (+RAW.settings['freq:'+e.id]||0) || keys.find(k=>cnt[k]>=2) || keys[0] || null;
  e.lastPM = pm.length?pm.map(r=>r.date).sort().pop():'';
  e.nextDue = e.lastPM&&e.baseFreq?addMonths(e.lastPM,e.baseFreq):'';
  e.overdueDays = e.nextDue?daysBetween(e.nextDue,todayISO()):0;
  e.cmCount=e.recs.filter(r=>r.type!=='PM').length;
  e.partsCount=e.recs.filter(r=>r.parts&&r.parts.length).length;
  const last=e.recs.find(r=>r.result); e.lastResult=last?last.result:'';
}

function pickEq(q){

  dd.innerHTML=L.map(e=>`<div onmousedown="F.equipIds.push('${esc(e.id)}');if(!F.contractorId&&F.contractType==='regular')F.contractorId=DB.eqById['${esc(e.id)}'].contractorId||'';renderForm();setTimeout(()=>$('#eqpick').focus(),0)"><b>${esc(e.id)}</b> <span class="muted">${esc(e.name)}</span></div>`).join('')||'<div class="muted">ไม่พบ</div>';
  dd.classList.add('on'); $('#eqpick').onblur=()=>setTimeout(()=>dd.classList.remove('on'),150);

function addSameCat(){ const cats=new Set(F.equipIds.map(id=>DB.eqById[id].category)); DB.equip.forEach(e=>{ if(cats.has(e.category)&&!F.equipIds.includes(e.id)) F.equipIds.push(e.id); }); renderForm(); }
function closeModal(){ $('#mbg').classList.remove('on'); F=null; }
function saveRecord(status){
  const err=[];
  if(!F.contractorId && !F.seed) err.push('ผู้รับเหมา');
  if(!F.equipIds.length) err.push('เครื่องจักร');
  if(!F.date) err.push('วันที่');
  if(F.type==='PM'&&!F.task) err.push('รอบ PM');
  if(F.type==='CM'&&!F.cause&&!F.seed) err.push('อาการ/สาเหตุ');
  if(!F.remark&&!F.seed) err.push('รายละเอียดงาน');
  if(F.contractType==='adhoc'&&!F.ref&&!F.seed) err.push('เลขที่ใบเสนอราคา/PO');
  F.parts=F.parts.filter(p=>p.name||p.code);
  if(F.type==='REPLACE'&&!F.parts.length) err.push('รายการอุปกรณ์ที่เปลี่ยน');
  if(status!=='draft'&&err.length){ alert('กรุณากรอก: '+err.join(', ')); return; }
  const base=Object.assign({},F); delete base._edit; delete base._unlock; delete base.equipIds;
  base.status=status; base.updatedAt=new Date().toISOString();
  const list=[];
  if(F._edit){ list.push(Object.assign(base,{equipId:F.equipId})); }
  else { const g=uid('g'); F.equipIds.forEach(eid=>{ const id=uid('r'); list.push(Object.assign({},base,{id,equipId:eid,groupId:g,createdAt:base.updatedAt,parts:JSON.parse(JSON.stringify(base.parts))})); }); }
  const msg=status==='draft'?'บันทึกร่างแล้ว':F.seed?'บันทึกการแก้ไขแล้ว':F._edit?'ส่งตรวจรับแล้ว':`บันทึก ${F.equipIds.length} เครื่องแล้ว — ส่งตรวจรับ`;
  Store.putRecords(list); buildDB(); closeModal(); route(); toast(msg);
}
function deleteRecord(){
  if(!confirm(GAS?'ลบรายการนี้ออกจาก Google Sheets? (ย้อนกลับไม่ได้ — ใช้ประวัติเวอร์ชันของชีทถ้าต้องกู้คืน)':'ลบรายการนี้? (ลบเฉพาะในระบบนี้ ไม่กระทบไฟล์ Excel ต้นฉบับ)')) return;
  Store.delRecord(F); buildDB(); closeModal(); route(); toast('ลบแล้ว');
}

function approve(id,ok){
  const by=($('#apby')||{}).value||''; if(ok&&!by){alert('กรอกชื่อผู้ตรวจรับก่อน');return;}

/* ====================== PM PLAN / COMPLIANCE ====================== */
function vPlan(){
  const y=UI.year, cur=todayISO().slice(0,7), sysF=UI.planSys||'';
  const L=DB.equip.filter(e=>!sysF||e.systemGroup===sysF);
  let exp=0, done=0;
  const rows=L.map(e=>{
    const pms=e.recs.filter(r=>r.type==='PM'&&r.date&&r.status!=='rejected');
    const first=pms.length?pms.map(r=>r.date).sort()[0]:'';
    const cells=MONTHS.map((_,i)=>{
      const ym=y+'-'+pad(i+1), here=pms.filter(r=>r.date.startsWith(ym)), cm=e.recs.filter(r=>r.type!=='PM'&&(r.date||'').startsWith(ym)).length;
      let expected=false;
      if(e.baseFreq&&first&&ym>=first.slice(0,7)&&ym<=cur){ const fm=(+first.slice(0,4))*12+(+first.slice(5,7)-1), m=y*12+i; expected=((m-fm)%e.baseFreq)===0; }
      if(expected){ exp++; if(here.length) done++; }
      const t=[...new Set(here.map(r=>r.task||'PM'))].join(',');
      return here.length?`<span class="cell c-done" title="${esc(here.map(r=>fdate(r.date)+' '+(r.task||'')).join('\n'))}">${esc(t)}</span>${cm?'<span class="cell c-cm">C</span>':''}`:expected?`<span class="cell c-miss" title="ครบรอบแต่ไม่มีบันทึก">ขาด</span>${cm?'<span class="cell c-cm">C</span>':''}`:cm?'<span class="cell c-cm">C</span>':'<span class="c-na">·</span>';
    });
    return `<tr><td><a href="#eq/${encodeURIComponent(e.id)}"><b>${esc(e.id)}</b></a> <span class="muted small">${e.baseFreq?e.baseFreq+'ด.':''}</span></td>${cells.map(c=>`<td>${c}</td>`).join('')}</tr>`;
  });
  const pct=exp?Math.round(done/exp*100):0;
  const years=[...new Set(DB.records.map(r=>(r.date||'').slice(0,4)).filter(Boolean))].sort().reverse();
  $('#main').innerHTML=head('แผน / ติดตามการทำ PM',`เทียบรอบที่ควรทำ (จากรอบ PM หลักของแต่ละเครื่อง) กับบันทึกจริง`,
    `<select style="width:auto" onchange="UI.year=+this.value;vPlan()">${years.map(x=>`<option value="${x}" ${+x===y?'selected':''}>ปี ${+x+543}</option>`).join('')}</select><select style="width:auto" onchange="UI.planSys=this.value;vPlan()"><option value="">ทุกระบบ</option>${Object.keys(SYS_TH).map(s=>`<option value="${s}" ${sysF===s?'selected':''}>${SYS_TH[s]}</option>`).join('')}</select>`)+
  `<div class="grid k4"><div class="kpi ${pct>=90?'ok':pct>=70?'warn':'bad'}"><div class="l">PM Compliance ปี ${y+543}</div><div class="v">${pct}%</div><div class="h">ทำแล้ว ${done} / ครบรอบ ${exp} ครั้ง (ถึงเดือนปัจจุบัน)</div></div>
   <div class="kpi"><div class="l">ความหมายสัญลักษณ์</div><div class="h" style="margin-top:6px;line-height:2"><span class="cell c-done">3M</span> ทำแล้ว (รอบ) &nbsp;<span class="cell c-miss">ขาด</span> ครบรอบแต่ไม่มีบันทึก &nbsp;<span class="cell c-cm">C</span> มีงานซ่อม</div></div></div>
  <div class="card" style="margin-top:16px;padding:0"><div class="tbl-wrap" style="max-height:70vh;border:0"><table class="matrix"><tr><th>เครื่อง</th>${MONTHS.map(m=>`<th>${m}</th>`).join('')}</tr>${rows.join('')}</table></div></div>`;
}

function needXLSX(){ if(!window.XLSX){ alert('โหลดตัวสร้าง Excel ไม่ได้ (ต้องต่ออินเทอร์เน็ต)'); return false;} return true; }
const thD = iso=>iso?iso.split('-').reverse().map((x,i)=>i===2?+x+543:+x).join('/'):'';
function exportEquipXlsx(id){
  if(!needXLSX()) return; const e=DB.eqById[id], wb=XLSX.utils.book_new();
  const reg=[['ทะเบียนประวัติเครื่องจักร ( Equipment Register & History )'],[e.info['Project Name']||''],[]].concat(Object.entries(e.info).map(([k,v])=>[k,v])).concat([[],['ข้อมูลทางเทคนิค ( Technical Data )']]).concat(Object.entries(e.tech).map(([k,v])=>[k,v]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(reg),e.id.slice(0,28));
  const pm=[['บันทึกการบำรุงรักษา ( Preventive Maintenance Record )'],[e.name+' : '+e.id],[],['วันที่ทำ (Date)','รอบ (Task)','ผู้ปฏิบัติงาน (By)','ผู้รับเหมา','รหัสอะไหล่ (Code)','รายการเปลี่ยนอะไหล่ ( Spare Parts )','หมายเหตุ ( Remark )','สถานะ']];
  e.recs.filter(r=>r.type==='PM').slice().reverse().forEach(r=>pm.push([thD(r.date)||r.rawDate,r.task,r.by,conName(r.contractorId),(r.parts||[]).map(p=>p.code).filter(Boolean).join(', '),(r.parts||[]).map(p=>p.name+(p.qty?' x'+p.qty:'')).filter(Boolean).join(', '),[r.remark,r.recommend].filter(Boolean).join(' / '),STATUS[r.status]?STATUS[r.status].t:'']));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(pm),'PM');
  const cm=[['บันทึกการซ่อม ( Repair Record )'],[e.name+' : '+e.id],[],['ครั้งที่','วันแจ้งซ่อม (Order Date)','เลขที่ใบแจ้งซ่อม (Job Number)','วันแล้วเสร็จ (Final Date)','ผู้รับเหมา','ประเภท','รหัสอะไหล่ (Code)','รายการเปลี่ยนอะไหล่ ( Spare Parts )','สาเหตุ (Cause)','การดำเนินการแก้ไข (Solution)','ค่าใช้จ่าย','PO/ใบเสนอราคา']];
  e.recs.filter(r=>r.type!=='PM').slice().reverse().forEach((r,i)=>cm.push([i+1,thD(r.date)||r.rawDate,r.job||'',thD(r.finishDate),conName(r.contractorId),r.contractType==='adhoc'?'เฉพาะกิจ':'ประจำ',(r.parts||[]).map(p=>p.code).filter(Boolean).join(', '),(r.parts||[]).map(p=>p.name+(p.qty?' x'+p.qty:'')).filter(Boolean).join(', '),r.cause||'',r.remark||'',r.cost||'',r.ref||'']));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cm),'CM');
  XLSX.writeFile(wb,`ประวัติเครื่องจักร ${e.id}.xlsx`);
}

function exportRecordsXlsx(all){ if(!needXLSX()) return; const L=all?DB.records:filteredRecords(); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(L.map(recRow)),'Records'); if(all){ XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.equip.map(e=>({'รหัส':e.id,'ชื่อ':e.name,'ระบบ':SYS_TH[e.systemGroup],'ประเภท':e.category,'ชั้น':e.info.Floor,'โซน':e.info.Zone,'รหัสเครื่องจักร':e.info['Code Number'],'ผู้รับเหมาประจำ':conName(e.contractorId),'รอบ PM (เดือน)':e.baseFreq||'','PM ล่าสุด':thD(e.lastPM),'ครบกำหนด':thD(e.nextDue)}))),'Equipment'); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.contractors.map(c=>({'ID':c.id,'ชื่อ':c.name,'ประเภท':CTYPE[c.type].t,'ขอบเขต':c.scope,'ความถี่':c.freq,'เริ่ม':c.start||'','สิ้นสุด':c.end||'','ครั้งทั้งหมด':c.totalRounds||'','ครั้งล่าสุด':c.lastRound||''}))),'Contractors'); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(DB.reports.map(r=>({'เดือน':r.month,'ผู้รับเหมา':conName(r.contractorId),'รายงาน':r.title,'ครั้งที่':r.round||'','เครื่อง':r.equipIds.join(', '),'สรุป':r.summary||'','ปัญหา':r.issues||'','ลิงก์':r.link||''}))),'MonthlyReports'); } XLSX.writeFile(wb,all?'ประวัติงานผู้รับเหมา_ทั้งหมด.xlsx':'ประวัติงานผู้รับเหมา.xlsx'); }
function backup(){ const b=new Blob([JSON.stringify(Store.user,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='contractor-history-backup-'+todayISO()+'.json'; a.click(); }
function restore(inp){ const f=inp.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const j=JSON.parse(rd.result); if(!j.records) throw new Error('ไฟล์ไม่ถูกต้อง'); if(!confirm('แทนที่ข้อมูลที่บันทึกในเครื่องนี้ด้วยไฟล์สำรอง?')) return; Store.user=Object.assign({records:{},deleted:{},contractors:{},reports:{},techMap:{},settings:{}},j); Store.save(); RAW=rawFromLocal(); buildDB(); route(); toast('กู้คืนข้อมูลแล้ว'); }catch(e){ alert(e.message); } }; rd.readAsText(f); }

  const n=Object.keys(Store.user.records).length;

   :`<div class="card"><h3>สำรอง / กู้คืน</h3><p class="muted">ข้อมูลที่บันทึกเพิ่มในระบบนี้ (${n} รายการ) เก็บอยู่ในเบราว์เซอร์เครื่องนี้ — ควรสำรองเป็นประจำ (หรือใช้เวอร์ชัน Google Sheets)</p><button class="btn" onclick="backup()">⇩ สำรองข้อมูล (.json)</button> <label class="btn">⇧ กู้คืน<input type="file" accept=".json" style="display:none" onchange="restore(this)"></label> <button class="btn bad" onclick="if(confirm('ล้างข้อมูลที่บันทึกเพิ่มทั้งหมด? (ข้อมูลนำเข้าจาก Excel ยังอยู่)')){localStorage.removeItem(LS_KEY);location.reload()}">ล้างข้อมูลที่เพิ่ม</button></div>`}</div>
  <div class="card"><h3>แหล่งข้อมูล</h3><ul class="muted" style="margin:0;padding-left:20px"><li>ประวัติเดิม: โฟลเดอร์ 1.4.2 ประวัติเครื่องจักรหลัก (Main Equipment History) by MA Service Contractor — 159 ไฟล์, PM ${DB.records.filter(r=>r.seed&&r.type==='PM').length.toLocaleString()} / ซ่อม ${DB.records.filter(r=>r.seed&&r.type!=='PM').length} รายการ (ดึงเมื่อ 23 พ.ย. 2569)</li><li>รายงานประจำเดือน: Service Report เดือน ก.ย. 2569 จำนวน 11 ฉบับ (ลงทะเบียนชื่อ/ครั้งที่ไว้แล้ว — แนบลิงก์ PDF ได้ที่หน้ารายงานประจำเดือน)</li></ul></div>`;
}
